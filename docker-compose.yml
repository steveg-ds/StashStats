services:

  web:
    build:
      context: .
      args:
        REPO_URL: "${REPO_URL:-}"
        BRANCH: "${BRANCH:-main}"
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: gunicorn -b 0.0.0.0:8050 --workers 1 --threads 4 --timeout 120 --capture-output --log-level debug --access-logfile - app:server
    ports:
      - "8051:8050"
    volumes:
      - .:/app:z
    environment:
      - TMPDIR=/tmp
      - API_USERNAME=${API_USERNAME}
      - API_KEY=${API_KEY}
      - RAVELRY_USERNAME=${RAVELRY_USERNAME}
      - DATABASE_URL=postgresql://stashuser:stashpassword@db:5432/stashstats
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=stashuser
      - POSTGRES_PASSWORD=stashpassword
      - POSTGRES_DB=stashstats
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stashuser -d stashstats"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
  pgdata:
